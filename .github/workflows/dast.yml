name: DAST del entorno demo

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL || 'https://enfermeros-demo.yersongallardo.com' }}
    steps:
      - name: Obtener configuración
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Escanear dominio demo sin crear incidencias
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.DEMO_BASE_URL }}
          allow_issue_writing: false
          # Las excepciones aceptadas se versionan en .zap/rules.tsv.
          # Cualquier alerta no exceptuada bloquea la ejecución.
          rules_file_name: .zap/rules.tsv
          fail_action: true
          artifact_name: zap-demo-report
      - name: Verificar cabeceras y contrato HTTP de la demo
        if: always()
        run: node app/scripts/security/smoke-live.mjs
