name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Los avisos de seguridad se publican con el tiempo, no cuando se toca el
  # codigo: sin esta ejecucion periodica main puede quedar expuesta durante
  # semanas si no hay pull requests abiertas. Miercoles, para alternar con el
  # DAST de los lunes.
  schedule:
    - cron: "41 6 * * 3"
  workflow_dispatch:

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Calidad, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Activar pnpm fijado
        run: corepack enable && corepack prepare pnpm@11.16.0 --activate
      - name: Instalar dependencias reproducibles
        run: pnpm install --frozen-lockfile
      - name: Generar y verificar datos sintéticos
        run: pnpm run data:demo && pnpm run data:verify && pnpm run data:import:check
      - name: Analizar estilo y tipos
        run: pnpm run lint
      - name: Ejecutar pruebas y build
        run: pnpm run test
      - name: Auditar el lockfile completo
        # Vinext empaqueta componentes declarados como devDependencies; una
        # auditoría --prod dejaría fuera parte de la superficie desplegada.
        run: pnpm audit --audit-level high

  dependency-review:
    name: Revisión de dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Bloquear vulnerabilidades altas o críticas nuevas
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: SAST CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analizar
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:javascript-typescript
